services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be set for production, e.g. https://api.example.com/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
